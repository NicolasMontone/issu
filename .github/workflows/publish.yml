name: Publish CLI

on:
  workflow_dispatch:
    inputs:
      increment:
        description: 'Version increment (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run typecheck
        run: pnpm typecheck

      - name: Get current version
        id: current-version
        run: |
          VERSION=$(node -e "console.log(require('./packages/cli/package.json').version)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Determine new version
        id: new-version
        run: |
          CURRENT=${{ steps.current-version.outputs.version }}
          INCREMENT=${{ github.event.inputs.increment }}
          
          # Parse version parts
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          
          case "$INCREMENT" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac
          
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Update version in CLI package
        run: |
          node -e "
            const fs = require('fs');
            const pkg = require('./packages/cli/package.json');
            pkg.version = '${{ steps.new-version.outputs.version }}';
            fs.writeFileSync('./packages/cli/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Update version in core package
        run: |
          node -e "
            const fs = require('fs');
            const pkg = require('./packages/core/package.json');
            pkg.version = '${{ steps.new-version.outputs.version }}';
            fs.writeFileSync('./packages/core/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Update version in root package
        run: |
          node -e "
            const fs = require('fs');
            const pkg = require('./package.json');
            pkg.version = '${{ steps.new-version.outputs.version }}';
            fs.writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Commit version bump
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add packages/cli/package.json packages/core/package.json package.json
          git commit -m "chore: bump version to ${{ steps.new-version.outputs.version }}"

      - name: Create git tag
        run: |
          git tag "v${{ steps.new-version.outputs.version }}"

      - name: Push changes and tag
        run: |
          git push origin main
          git push origin "v${{ steps.new-version.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish core to npm
        run: |
          cd packages/core
          pnpm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish CLI to npm
        run: |
          cd packages/cli
          pnpm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.new-version.outputs.version }}
          release_name: Release ${{ steps.new-version.outputs.version }}
          body: |
            Published `issu` CLI v${{ steps.new-version.outputs.version }}
            
            - CLI: `npm install -g issu`
            - Core: `npm install @issu/core`
          draft: false
          prerelease: false
